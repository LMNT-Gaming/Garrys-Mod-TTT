<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>LMNT | TTT2</title>
<style>
  /* Schriften lokal (OFL), keine Anfragen an Dritte */
  @font-face { font-family: "Archivo Black"; src: url("fonts/ArchivoBlack-Regular.ttf") format("truetype"); }
  @font-face { font-family: "DM Sans"; src: url("fonts/DMSans-Regular.ttf") format("truetype"); font-weight: 400; }
  @font-face { font-family: "DM Sans"; src: url("fonts/DMSans-Bold.ttf") format("truetype"); font-weight: 700; }

  /* Tokens aus lmnt-gaming.net */
  :root {
    --ink: #08070c; --ink-soft: #111018; --paper: #f2efe8; --white: #fffdf8;
    --acid: #ff3131; --coral: #e10f22; --violet: #a80016; --muted: #a5a1ac; --online: #37e66b;
    --line: rgba(255,255,255,.14);
    --display: "Archivo Black", Impact, sans-serif; --body: "DM Sans", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; color: var(--paper); font-family: var(--body);
    background: radial-gradient(circle at 76% 45%, rgba(225,15,34,.22), transparent 22%),
                radial-gradient(circle at 20% 60%, rgba(255,49,49,.12), transparent 28%), var(--ink); }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 64px 64px; mask-image: linear-gradient(to bottom, #000, transparent 92%); }

  .label { font-size: 13px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .label b { color: var(--acid); }

  .wrap { position: relative; height: 100%; display: grid; grid-template-rows: 1fr auto auto; padding: 56px 72px 0; gap: 32px; }

  .hero { align-self: center; }
  .brand { display: flex; align-items: baseline; gap: 18px; }
  .brand .lmnt { font-family: var(--display); font-size: 150px; line-height: .85; letter-spacing: -.05em; color: var(--white); }
  .brand .sub { font-weight: 700; letter-spacing: .17em; text-transform: uppercase; color: var(--muted); font-size: 18px; line-height: 1.3; }
  .tagline { margin-top: 26px; font-family: var(--display); font-size: 44px; letter-spacing: -.03em; text-transform: uppercase; }
  .tagline span { color: var(--acid); }
  .mode { margin-top: 10px; color: var(--muted); font-size: 18px; }

  .panel { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; align-items: end; }
  .card { background: rgba(17,16,24,.85); border: 1px solid var(--line); border-radius: 18px; padding: 24px 28px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 14px; }
  .stat .v { font-family: var(--display); font-size: 26px; color: var(--white); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 8px; background: rgba(255,255,255,.08); border-radius: 999px; overflow: hidden; margin-top: 18px; }
  .bar > div { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #ff3131, #9b0014); transition: width .35s; }
  .status { margin-top: 12px; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--online); margin-right: 8px; box-shadow: 0 0 10px var(--online); }
  .tip { font-size: 19px; line-height: 1.45; min-height: 84px; margin-top: 12px; transition: opacity .45s; }
  .tip b { color: var(--acid); }

  .ticker { margin: 0 -72px; border-top: 1px solid var(--line); background: var(--acid); color: var(--ink); overflow: hidden; white-space: nowrap; }
  .ticker .track { display: inline-block; padding: 12px 0; font-family: var(--display); font-size: 18px; letter-spacing: .02em; animation: scroll 40s linear infinite; }
  .ticker .track span { margin: 0 22px; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="label"><b>01</b> / Verbindung wird aufgebaut</div>
    <div class="brand" style="margin-top:18px">
      <div class="lmnt">LMNT</div>
      <div class="sub">Gaming<br>Collective</div>
    </div>
    <div class="tagline">We host. <span>You play.</span></div>
    <div class="mode">Trouble in Terrorist Town 2 · Rollen · Level · Spezialrunden</div>
  </section>

  <section class="panel">
    <div class="card">
      <div class="label"><b>02</b> / Server</div>
      <div class="stats">
        <div class="stat"><div class="label">Server</div><div class="v" id="server">–</div></div>
        <div class="stat"><div class="label">Map</div><div class="v" id="map">–</div></div>
        <div class="stat"><div class="label">Slots</div><div class="v" id="slots">–</div></div>
      </div>
      <div class="bar"><div id="progress"></div></div>
      <div class="status"><span class="dot"></span><span id="status">Verbinde …</span></div>
    </div>
    <div class="card">
      <div class="label"><b>03</b> / Tipp</div>
      <div class="tip" id="tip"></div>
    </div>
  </section>

  <div class="ticker"><div class="track" id="ticker"></div></div>
</div>

<script>
  var words = ["TTT2", "Rollen", "Spezialrunden", "Level & Punkte", "Pointshop", "Narr", "Sanitäter", "Hacker", "LMNT"];
  var line = words.map(function (w) { return "<span>" + w.toUpperCase() + "</span><span>✦</span>"; }).join("");
  document.getElementById("ticker").innerHTML = line + line;

  var tips = [
    "<b>F4</b> oder <b>!shop</b> öffnet den Pointshop – Punkte gibt es für jede Runde.",
    "Der <b>Narr</b> gewinnt, wenn du ihn tötest. Überleg es dir gut!",
    "Der <b>Sanitäter</b> heilt mit der Medigun auch das Gift von Giftpfeilen.",
    "Hörst du ein Störsignal? Dann ist ein <b>Hacker</b> aktiv – geh in Deckung.",
    "Mit <b>@Text</b> erreichst du das Server-Team.",
    "<b>!stats</b> zeigt deine Statistik, <b>!top</b> die Bestenliste.",
    "Spezialrunden wie <b>Mondlandung</b> oder <b>Vampirnacht</b> starten zufällig.",
    "<b>!regeln</b> zeigt die Serverregeln. Kein RDM!"
  ];
  var tipIndex = Math.floor(Math.random() * tips.length);
  var tipEl = document.getElementById("tip");
  tipEl.innerHTML = tips[tipIndex];
  setInterval(function () {
    tipEl.style.opacity = 0;
    setTimeout(function () { tipIndex = (tipIndex + 1) % tips.length; tipEl.innerHTML = tips[tipIndex]; tipEl.style.opacity = 1; }, 450);
  }, 6000);

  var total = 0, needed = 0;
  function updateBar() {
    if (total > 0) document.getElementById("progress").style.width = Math.max(0, Math.min(100, (1 - needed / total) * 100)) + "%";
  }

  // Von Garry's Mod aufgerufene Funktionen
  function GameDetails(servername, serverurl, mapname, maxplayers) {
    document.getElementById("server").textContent = servername;
    document.getElementById("map").textContent = mapname;
    document.getElementById("slots").textContent = maxplayers;
  }
  function SetFilesTotal(t) { total = t; updateBar(); }
  function SetFilesNeeded(n) { needed = n; updateBar(); }
  function DownloadingFile(f) { document.getElementById("status").textContent = "Lade " + f; }
  function SetStatusChanged(s) {
    document.getElementById("status").textContent = s;
    if (s.indexOf("Sending client info") !== -1) document.getElementById("progress").style.width = "100%";
  }
</script>
</body>
</html>
