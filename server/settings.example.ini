; =====================================================================
;  LMNT | TTT2 – zentrale Servereinstellungen
;  Wird von install.ps1, deploy.ps1, start.bat und den FastDL-Tools gelesen.
;  Format: SCHLUESSEL=Wert   (keine Anführungszeichen, keine Leerzeichen um "=")
; =====================================================================

; Wohin der Dedicated Server installiert wird (eigener Ordner, nicht dieses Projekt!)
SERVER_DIR=C:\LMNT\GModServer

; Spiel
HOSTNAME=LMNT | TTT2 | Rollen - Level - Pointshop
PORT=27015
MAXPLAYERS=20
MAP=ttt_minecraft_b5
TICKRATE=66

; RCON-Ziel für tools\rcon.py und tools\test_server.ps1.
; Nicht 127.0.0.1 verwenden, wenn Apple-Software installiert ist: der "Apple Mobile Device Service"
; belegt lokal ebenfalls Port 27015. Die LAN-IP zeigt der Server beim Start an ("Network: IP ...").
RCON_HOST=127.0.0.1

; Passwörter – UNBEDINGT ändern!
RCON_PASSWORD=bitte-aendern-1234
SERVER_PASSWORD=

; Owner: SteamID64(s), komma-getrennt. deploy.ps1 schreibt sie nach data\lmnt\owners.txt.
; Deine SteamID64 findest du z. B. auf steamid.io.
OWNERS=

; Steam Workshop
; COLLECTION_ID: ID deiner Steam-Kollektion (siehe docs\WORKSHOP.md)
; STEAM_AUTHKEY: Web-API-Key von https://steamcommunity.com/dev/apikey
; GSLT: Game Server Login Token von https://steamcommunity.com/dev/managegameservers (App-ID 4000)
COLLECTION_ID=
STEAM_AUTHKEY=
GSLT=

; FastDL – öffentliche Adresse, unter der der Webserver erreichbar ist (mit / am Ende)
FASTDL_PORT=8080
FASTDL_URL=http://127.0.0.1:8080/
