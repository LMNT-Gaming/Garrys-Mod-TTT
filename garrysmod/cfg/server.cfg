// =====================================================================
//  LMNT | TTT2 – server.cfg
//  Platzhalter {{...}} werden von server\deploy.ps1 aus settings.ini ersetzt.
// =====================================================================

// --- Grundlagen -------------------------------------------------------
hostname            "{{HOSTNAME}}"
sv_password         "{{SERVER_PASSWORD}}"
rcon_password       "{{RCON_PASSWORD}}"
sv_region           3               // 3 = Europa
sv_lan              0
sv_loadingurl       "{{FASTDL_URL}}loading/"

// --- Downloads (FastDL) ----------------------------------------------
sv_allowdownload    0               // nichts direkt vom Gameserver laden (langsam)
sv_allowupload      0
sv_downloadurl      "{{FASTDL_URL}}"

// --- Netzwerk ---------------------------------------------------------
sv_minrate          0
sv_maxrate          0
sv_minupdaterate    33
sv_maxupdaterate    66
sv_mincmdrate       33
sv_maxcmdrate       66
net_maxfilesize     64

// --- Sicherheit / Logs -------------------------------------------------
sv_logbans          1
log                 on
sv_rcon_banpenalty  30
sv_rcon_maxfailures 5
sbox_noclip         0
sv_cheats           0               // Anti-Cheat-Härtung (T-091)
sv_allowcslua       0               // Clients dürfen kein eigenes Lua ausführen
sv_kickerrornum     0

// --- TTT: Runden ------------------------------------------------------
ttt_preptime_seconds           30
ttt_firstpreptime              60
ttt_posttime_seconds           15
ttt_roundtime_minutes          10
ttt_haste                      1
ttt_haste_starting_minutes     5
ttt_haste_minutes_per_death    0.5
ttt_round_limit                8
ttt_time_limit_minutes         75
ttt_minimum_players            2

// --- TTT: Rollenverteilung ---------------------------------------------
// TTT2 erzeugt diese ConVars pro Rolle: ttt_<rollenname>_pct/_max/_min_players/_enabled/_random
// (lua/ttt2/libraries/roles.lua) – daher auch für eigene Rollen nutzbar.
ttt_traitor_pct                0.25
ttt_traitor_max                32
ttt_detective_pct              0.13
ttt_detective_max              32
ttt_detective_min_players      8
ttt_newroles_enabled           1

// --- LMNT-Rollen (TTT2 legt diese ConVars automatisch an) --------------
ttt_narr_enabled               1
ttt_sanitaeter_enabled         1
ttt_hacker_enabled             1

// --- TTT: Karma ---------------------------------------------------------
ttt_karma                      1
ttt_karma_strict               1
ttt_karma_low_autokick         1
ttt_karma_low_amount           450
ttt_karma_low_ban              0

// --- TTT: Credits ----------------------------------------------------------
// Pro Rolle über das Rollen-Kürzel: ttt_<kürzel>_credits_starting (traitor, det, hck …)
ttt_traitor_credits_starting   2
ttt_det_credits_starting       1
ttt_hck_credits_starting       3

// --- Sonstiges -------------------------------------------------------------
// Ragdoll-Pinning pro Rolle: ttt2_ragdoll_pinning_<rollenname>
ttt2_ragdoll_pinning_traitor   1
ttt2_ragdoll_pinning_innocent  0
ttt_teleport_telefrags         1
ttt_allow_discomb_jump         0

// Mapcycle (Datei liegt in cfg/)
mapcyclefile                   "mapcycle.txt"

writeid
writeip
